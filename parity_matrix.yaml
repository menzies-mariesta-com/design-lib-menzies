# Flutter Wash UI parity vs web demo (honest status per route).
# Regenerate: npm run flutter:generate && dart run tool/gallery_depth_audit.dart

default_status: not_started

notes:
  buttons: Full section parity with Preview + Dart tabs (reference page).
  generated_pages: Section count matches web GallerySection; previews use legacy widget until ported.
  charts_advanced: CustomPainter engine; category widgets are beta vs Apex depth.
  golden_buttons: test/buttons_gallery_golden_test.dart (run with --update-goldens locally).

test_harness:
  package: packages/menzies_design_wash_ui/test/gallery_coverage_test.dart
  depth_audit: tool/gallery_depth_audit.dart
  page_ids: packages/menzies_design_wash_ui/lib/src/gallery/wash_gallery_page_ids.g.dart

