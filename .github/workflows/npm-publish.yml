name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, build only and skip npm publish'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@menzies-mariesta-com'

      - name: Install dependencies
        run: npm ci

      - name: Build wash-ui + MCP packages
        run: |
          npm run build:lib
          npm run mcp:build:all

      # Fail before publish if NPM_TOKEN is missing/empty (avoids opaque ENEEDAUTH).
      # Create a Granular Access Token (Automation) on npmjs with publish for
      # @menzies-mariesta-com/*, then add it as repo secret NPM_TOKEN:
      # Settings → Secrets and variables → Actions → New repository secret.
      - name: Require NPM_TOKEN for npmjs publish
        if: ${{ inputs.dry_run != 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing or empty."
            echo "Add a Granular Access Token (Automation) from npmjs.org with publish"
            echo "permission for @menzies-mariesta-com/* as repo secret NPM_TOKEN"
            echo "(Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Publish to npmjs.org (public)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in \
            @menzies-mariesta-com/menzies-design-wash-ui \
            @menzies-mariesta-com/wash-ui-mcp \
            @menzies-mariesta-com/wash-compose-mcp
          do
            npm publish -w "$pkg" \
              --access public \
              --registry https://registry.npmjs.org \
              --@menzies-mariesta-com:registry=https://registry.npmjs.org
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@menzies-mariesta-com'

      - name: Publish to GitHub Packages
        if: ${{ inputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for pkg in \
            @menzies-mariesta-com/menzies-design-wash-ui \
            @menzies-mariesta-com/wash-ui-mcp \
            @menzies-mariesta-com/wash-compose-mcp
          do
            npm publish -w "$pkg" \
              --access public \
              --registry https://npm.pkg.github.com \
              --@menzies-mariesta-com:registry=https://npm.pkg.github.com
          done
