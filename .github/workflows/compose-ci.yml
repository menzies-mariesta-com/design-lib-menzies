name: Compose CI

on:
  push:
    paths:
      - 'packages/menzies-design-wash-compose/**'
      - 'apps/demo-android/**'
      - 'kotlin-js-store/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/compose-ci.yml'
  pull_request:
    paths:
      - 'packages/menzies-design-wash-compose/**'
      - 'apps/demo-android/**'
      - 'kotlin-js-store/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/compose-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # v4: Node 24 + no obsolete `tools` package (Google removed it; v3 fails sdkmanager)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile library and demo
        run: |
          ./gradlew :menzies-design-wash-compose:check :demo-android:assembleDebug :menzies-design-wash-compose:compileKotlinDesktop :menzies-design-wash-compose:compileKotlinJs --no-daemon
